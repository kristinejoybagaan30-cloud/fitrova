<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITROVA</title>
<style>
:root{--pink:#ff2e7e;--dark:#0f0f0f;--card:#1e1e1e;--input:#2a2a2a;--text:#fff;--gray:#aaa;--line:#333;--ok:#00c896;--warn:#ffb020}
.light{--dark:#f5f5f7;--card:#fff;--input:#eee;--text:#111;--gray:#666;--line:#ddd}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,system-ui,sans-serif}
body{background:var(--dark);color:var(--text);padding:14px;transition:.3s;max-width:900px;margin:auto}
.logo{font-size:28px;font-weight:900;letter-spacing:2px}.logo span{color:var(--pink)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 20px rgba(0,0,0,.2)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none;background:var(--input);color:var(--text);font-size:15px}
button{background:var(--pink);border:none;color:#fff;padding:12px;width:100%;border-radius:12px;font-weight:bold;margin-top:8px;cursor:pointer;font-size:14px}
button:disabled{opacity:.5}
button.sec{background:var(--input);color:var(--text)}
button.ok{background:var(--ok)}button.warn{background:var(--warn);color:#111}
button.sm{width:auto;padding:7px 11px;margin:2px;font-size:12px}
.hidden{display:none}.small{color:var(--gray);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.tabs button{margin:0;background:var(--input);color:var(--text);flex:1}.tabs button.on{background:var(--pink);color:#fff}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--pink);color:#fff;display:inline-block;margin-left:4px}
.badge.admin{background:#7c4dff}.badge.trainer{background:#1e88e5}.badge.user{background:var(--ok)}
.badge.revoked{background:#e53935}.badge.pending{background:var(--warn);color:#111}.badge.active{background:var(--ok)}
.ex{background:var(--input);border-radius:14px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex .e{font-size:26px;margin-right:8px}.ex.done{opacity:.55}
.feedback{border-left:4px solid var(--pink);padding:10px;background:rgba(255,46,126,.12);border-radius:0 12px 12px 0;margin:8px 0}
.sugg{border-left:4px solid #1e88e5;padding:10px;background:rgba(30,136,229,.12);border-radius:0 12px 12px 0;margin:8px 0}
.timer{font-size:56px;text-align:center;font-weight:900;margin:10px 0}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:900;margin:auto;position:relative}
.ring::after{content:attr(data-t);position:absolute;inset:8px;background:var(--card);border-radius:50%;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--input);border-radius:14px;padding:12px;text-align:center}.stat b{font-size:24px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
canvas{width:100%;background:var(--input);border-radius:12px;margin-top:8px}
.water{position:fixed;bottom:20px;left:5%;right:5%;background:var(--pink);padding:12px;border-radius:12px;text-align:center;z-index:999;display:none;color:#fff}
.err{color:#ff6b6b;font-size:13px;margin-top:6px}.good{color:var(--ok);font-size:13px;margin-top:6px}
.ro{background:rgba(30,136,229,.15);color:#64b5f6;padding:6px 10px;border-radius:10px;font-size:12px;margin:6px 0}
.setup{background:rgba(255,176,32,.15);border:1px solid var(--warn);padding:12px;border-radius:12px;font-size:13px;margin:8px 0}
img.ph{width:100%;border-radius:12px;margin-top:6px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">FIT<span>ROVA</span></div>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="who" class="small"></span>
    <button class="sm sec" onclick="toggleMode()">🌙</button>
    <button class="sm sec hidden" id="logoutBtn" onclick="logout()">Logout</button>
  </div>
</div>
<div id="waterPop" class="water">💧 Time to drink 250ml water!</div>
<div id="root"><p class="small" style="text-align:center;margin-top:40px">Loading…</p></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,getDocs,collection,collectionGroup,onSnapshot,increment} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== 1) PASTE YOUR FIREBASE CONFIG HERE (Firebase Console > Project settings > Your apps > Web) ====== */
const firebaseConfig={
  apiKey:"AIzaSyDI8SuSh6_MT3z8-lAYhPV--a87otnVizA",
  authDomain:"fitrova-dd637.firebaseapp.com",
  projectId:"fitrova-dd637",
  storageBucket:"fitrova-dd637.firebasestorage.app",
  messagingSenderId:"676078954562",
  appId:"1:676078954562:web:58ad369b052ac8a8a5db"
};
/* ================================================================================================== */
/* ====== 2) RESERVED ACCOUNTS: whoever registers with these emails becomes Admin / Trainer automatically.
   Everyone else is a User. Keep these lists IDENTICAL to the ones in firestore.rules (the rules enforce them). ====== */
const ADMIN_EMAILS=['admin@fitrova.com'];
const TRAINER_EMAILS=['trainer@fitrova.com'];
const roleFor=email=>ADMIN_EMAILS.includes(email)?'admin':TRAINER_EMAILS.includes(email)?'trainer':'user';
/* ================================================================================================== */
const CONFIGURED=!firebaseConfig.apiKey.startsWith('YOUR_');
let auth,db;
if(CONFIGURED){const fb=initializeApp(firebaseConfig);auth=getAuth(fb);db=getFirestore(fb)}

/* ================= HELPERS ================= */
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=t=>t?new Date(t).toLocaleString():'—';
const byT=(a,b)=>a.t-b.t;
const mapDocs=s=>s.docs.map(d=>({id:d.id,...d.data()}));

/* ================= DATA ================= */
const EX=[
 {id:'crunch',n:'Crunches',e:'🔥',g:['belly','all'],p:'home',d:'3 x 20'},
 {id:'plank',n:'Plank',e:'🧱',g:['belly','all'],p:'home',d:'3 x 45s'},
 {id:'legraise',n:'Leg Raises',e:'🦵',g:['belly'],p:'home',d:'3 x 15'},
 {id:'mclimb',n:'Mountain Climbers',e:'⛰️',g:['belly','all'],p:'home',d:'3 x 30s'},
 {id:'squat',n:'Squats',e:'🍑',g:['flatbutt','all'],p:'home',d:'4 x 20'},
 {id:'bridge',n:'Glute Bridge',e:'🍑',g:['flatbutt'],p:'home',d:'4 x 15'},
 {id:'lunge',n:'Lunges',e:'🚶',g:['flatbutt','all'],p:'home',d:'3 x 12/leg'},
 {id:'hipthrust',n:'Hip Thrust',e:'🏋️',g:['flatbutt'],p:'gym',d:'4 x 12'},
 {id:'pushup',n:'Push-ups',e:'💪',g:['payat','all'],p:'home',d:'4 x 12'},
 {id:'deadlift',n:'Deadlift',e:'🏋️',g:['payat'],p:'gym',d:'4 x 8'},
 {id:'bench',n:'Bench Press',e:'🏋️',g:['payat'],p:'gym',d:'4 x 8'},
 {id:'row',n:'Dumbbell Row',e:'💪',g:['payat','all'],p:'gym',d:'4 x 10'},
 {id:'jack',n:'Jumping Jacks',e:'🤸',g:['all','belly'],p:'home',d:'3 x 40s'},
 {id:'yoga',n:'Rest-day Yoga',e:'🧘',g:['all','belly','flatbutt','payat'],p:'home',d:'15 min'}
];
const GOALS={belly:'😣 Belly Fat – Flat stomach',flatbutt:'🍑 Flat Butt – Bigger glutes',payat:'🦴 Skinny – Muscle mass',all:'💪 Fit & Sexy Overall'};
const MEALS={
 belly:'🥗 Lean protein + veggies, cut sugary drinks, drink lots of water.',
 flatbutt:'🍗 Protein every meal (eggs, chicken, fish) + rice/sweet potato.',
 payat:'🍚 Eat more: rice, eggs, banana + peanut butter, milk. Add a snack.',
 all:'🥦 Balanced plate: ½ veggies, ¼ protein, ¼ carbs.'
};
const exById=id=>EX.find(x=>x.id===id);

/* ================= STATE ================= */
let S={me:null,users:[],reports:[],allLogs:[],logs:[],weights:[],assigned:[],photos:{},detail:null,d:{logs:[],weights:[],assigned:[],photos:{}},err:''};
let ui={tab:'overview'},authTab='register',msg='',registering=false,loginIntent=false;
let unsubs=[],dUnsubs=[],waterT=null,timerInt=null,tsec=0;

function toggleMode(){document.body.classList.toggle('light');try{localStorage.setItem('fx_mode',document.body.classList.contains('light')?'l':'d')}catch(e){}}
try{if(localStorage.getItem('fx_mode')==='l')document.body.classList.add('light')}catch(e){}
function startWater(){clearInterval(waterT);waterT=setInterval(()=>{const w=document.getElementById('waterPop');w.style.display='block';setTimeout(()=>w.style.display='none',5000)},3600000)}

/* ================= LISTENERS ================= */
const sub=(ref,cb)=>onSnapshot(ref,cb,e=>{console.error(e);S.err='Database error: '+(e.code||e.message)+'. Check your Firestore rules.';render()});
function clearAll(){unsubs.forEach(f=>f());unsubs=[];closeDetail(true);clearInterval(waterT);
  S={me:null,users:[],reports:[],allLogs:[],logs:[],weights:[],assigned:[],photos:{},detail:null,d:{logs:[],weights:[],assigned:[],photos:{}},err:''};ui={tab:'overview'}}
function attach(p){
  const id=p.id;
  unsubs.push(sub(doc(db,'users',id),s=>{
    if(!s.exists()||s.data().status!=='active'){msg='<p class="err">Your access was revoked or the account was removed.</p>';signOut(auth);return}
    S.me={id:s.id,...s.data()};render();
  }));
  if(p.role==='user'){
    unsubs.push(sub(collection(db,'users',id,'logs'),s=>{S.logs=mapDocs(s).sort(byT);render()}));
    unsubs.push(sub(collection(db,'users',id,'weights'),s=>{S.weights=mapDocs(s).sort(byT);render()}));
    unsubs.push(sub(collection(db,'users',id,'assigned'),s=>{S.assigned=mapDocs(s).sort(byT);render()}));
    unsubs.push(sub(collection(db,'users',id,'photos'),s=>{S.photos={};s.docs.forEach(d=>S.photos[d.id]=d.data().data);render()}));
  }else{
    unsubs.push(sub(collection(db,'users'),s=>{S.users=mapDocs(s);render()}));
    if(p.role==='admin'){
      unsubs.push(sub(collection(db,'reports'),s=>{S.reports=mapDocs(s).sort(byT);render()}));
      unsubs.push(sub(collectionGroup(db,'logs'),s=>{S.allLogs=mapDocs(s).sort((a,b)=>b.t-a.t);render()}));
    }
  }
}
function openDetail(id){
  closeDetail(true);S.detail=id;S.d={logs:[],weights:[],assigned:[],photos:{}};
  dUnsubs.push(sub(collection(db,'users',id,'logs'),s=>{S.d.logs=mapDocs(s).sort(byT);render()}));
  dUnsubs.push(sub(collection(db,'users',id,'weights'),s=>{S.d.weights=mapDocs(s).sort(byT);render()}));
  dUnsubs.push(sub(collection(db,'users',id,'assigned'),s=>{S.d.assigned=mapDocs(s).sort(byT);render()}));
  dUnsubs.push(sub(collection(db,'users',id,'photos'),s=>{S.d.photos={};s.docs.forEach(d=>S.d.photos[d.id]=d.data().data);render()}));
  render();
}
function closeDetail(silent){dUnsubs.forEach(f=>f());dUnsubs=[];S.detail=null;if(!silent)render()}
function setTab(k){closeDetail(true);ui.tab=k;render()}

/* ================= AUTH ================= */
if(CONFIGURED){
  onAuthStateChanged(auth,async fbUser=>{
    if(registering)return;
    clearAll();
    if(!fbUser){return render()}
    try{
      const snap=await getDoc(doc(db,'users',fbUser.uid));
      if(!snap.exists()){msg='<p class="err">Account profile not found. It may have been deleted.</p>';await signOut(auth);return}
      const p={id:snap.id,...snap.data()};
      if(p.status==='revoked'){msg='<p class="err">Your access has been revoked. Contact an admin.</p>';await signOut(auth);return}
      if(p.status==='pending'){msg='<p class="err">Your trainer account is waiting for admin approval.</p>';await signOut(auth);return}
      S.me=p;
      if(loginIntent){loginIntent=false;updateDoc(doc(db,'users',p.id),{lastLogin:Date.now(),loginCount:increment(1)}).catch(console.error)}
      attach(p);render();
    }catch(e){console.error(e);msg='<p class="err">Could not load your profile: '+esc(e.code||e.message)+'</p>';signOut(auth)}
  });
}else render();

let authTabSet=k=>{authTab=k;msg='';render()};
function renderAuth(){
  document.getElementById('logoutBtn').classList.add('hidden');document.getElementById('who').textContent='';
  const reg=authTab==='register';
  root.innerHTML=`<div class="card">
   ${CONFIGURED?'':`<div class="setup">⚠️ Firebase is not configured yet. Open <b>index.html</b> and paste your <b>firebaseConfig</b> (see README.md).</div>`}
   <div class="tabs"><button class="${reg?'on':''}" onclick="authTabSet('register')">Register</button><button class="${!reg?'on':''}" onclick="authTabSet('login')">Login</button></div>
   ${reg?`<h2>Create Account</h2><p class="small">Register first, then login.</p>
    <input id="r_name" placeholder="Full name - ex: Jhea">
    <input id="r_email" type="email" placeholder="Email" oninput="document.getElementById('r_body').style.display=roleFor(this.value.trim().toLowerCase())==='user'?'block':'none'">
    <input id="r_pass" type="password" placeholder="Password (min 6 characters)">
    <input id="r_pass2" type="password" placeholder="Confirm password">
    <div id="r_body"><div class="row"><input id="r_age" type="number" placeholder="Age"><input id="r_height" type="number" placeholder="Height cm"></div>
    <input id="r_weight" type="number" placeholder="Weight kg - ex: 55"></div>
    <button id="regBtn" onclick="doRegister()">Register</button>`
   :`<h2>Welcome back</h2>
    <input id="l_email" type="email" placeholder="Email">
    <input id="l_pass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" onclick="doLogin()">Login</button>`}
   <div id="msg">${msg}</div></div>`;
}
const setMsg=m=>{const e=document.getElementById('msg');if(e)e.innerHTML=m};
const authErr=e=>{
  const c=e.code||'';
  if(['auth/invalid-credential','auth/user-not-found','auth/wrong-password','auth/invalid-email'].includes(c))return 'Wrong email or password.';
  if(c==='auth/email-already-in-use')return 'That email is already registered.';
  if(c==='auth/weak-password')return 'Password must be at least 6 characters.';
  if(c==='auth/too-many-requests')return 'Too many attempts. Try again later.';
  if(c==='auth/network-request-failed')return 'Network error. Check your internet.';
  if(c==='permission-denied')return 'Permission denied by database rules.';
  return e.message||'Something went wrong.';
};
async function doRegister(){
  if(!CONFIGURED)return setMsg('<p class="err">Firebase is not configured yet.</p>');
  const v=id=>document.getElementById(id).value.trim();
  const name=v('r_name'),email=v('r_email').toLowerCase(),pw=document.getElementById('r_pass').value,pw2=document.getElementById('r_pass2').value;
  const role=roleFor(email);
  const err=m=>setMsg(`<p class="err">${m}</p>`);
  if(!name||!email)return err('Name and email are required.');
  if(!/^\S+@\S+\.\S+$/.test(email))return err('Enter a valid email.');
  if(pw.length<6)return err('Password must be at least 6 characters.');
  if(pw!==pw2)return err('Passwords do not match.');
  let age=0,height=0,weight=0;
  if(role==='user'){age=+v('r_age');height=+v('r_height');weight=+v('r_weight');
    if(!age||!height||!weight)return err('Age, height and weight are required to calculate BMI.')}
  document.getElementById('regBtn').disabled=true;
  registering=true;let cred=null;
  try{
    cred=await createUserWithEmailAndPassword(auth,email,pw);
    const uid=cred.user.uid;
    const status=role==='trainer'?'pending':'active';
    await setDoc(doc(db,'users',uid),{name,email,role,status,age,height,weight,goal:'all',created:Date.now(),lastLogin:null,loginCount:0});
    if(role==='user')await addDoc(collection(db,'users',uid,'weights'),{d:today(),w:weight,t:Date.now()}).catch(console.error);
    msg=role==='trainer'
      ? '<p class="good">Trainer registration submitted. Your account is pending admin approval. You can log in after the admin approves it.</p>'
      : role==='admin'
        ? '<p class="good">Admin account registered. You can now log in to the Admin dashboard.</p>'
        : '<p class="good">Account registered. You can now log in.</p>';
    authTab='login';
  }catch(e){
    console.error(e);
    if(cred){try{await cred.user.delete()}catch(_){}}
    msg=`<p class="err">${esc(authErr(e))}</p>`;authTab='register';
  }
  registering=false;
  await signOut(auth).catch(()=>{});
  clearAll();render();
}
async function doLogin(){
  if(!CONFIGURED)return setMsg('<p class="err">Firebase is not configured yet.</p>');
  const email=document.getElementById('l_email').value.trim().toLowerCase(),pw=document.getElementById('l_pass').value;
  if(!email||!pw)return setMsg('<p class="err">Enter your email and password.</p>');
  document.getElementById('loginBtn').disabled=true;
  loginIntent=true;msg='';
  try{await signInWithEmailAndPassword(auth,email,pw)}
  catch(e){loginIntent=false;msg=`<p class="err">${esc(authErr(e))}</p>`;render()}
}
async function logout(){msg='';authTab='login';await signOut(auth)}

/* ================= ROUTER ================= */
function render(){
  const u=S.me;
  if(!u)return renderAuth();
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('who').innerHTML=`${esc(u.name)}<span class="badge ${u.role}">${u.role}</span>`;
  if(u.role==='admin')renderAdmin(u);else if(u.role==='trainer')renderTrainer(u);else renderUser(u);
  if(S.err)root.insertAdjacentHTML('afterbegin',`<div class="card err">${esc(S.err)}</div>`);
}

/* ================= SHARED HELPERS ================= */
const bmi=u=>{const h=u.height/100;return h?(u.weight/(h*h)):0};
const bmiLabel=b=>b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obese';
function streak(logs){
  const days=new Set((logs||[]).map(l=>l.d));let s=0;const d=new Date();
  if(!days.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);
  while(days.has(d.toISOString().slice(0,10))){s++;d.setDate(d.getDate()-1)}return s;
}
function drawChart(id,ws){
  const c=document.getElementById(id);if(!c)return;const w=c.width=c.clientWidth*2,h=c.height=320,x=c.getContext('2d');
  x.clearRect(0,0,w,h);if(!ws||ws.length<2){x.fillStyle='#888';x.font='24px sans-serif';x.fillText('Log 2+ weights to see chart',20,h/2);return}
  const v=ws.map(a=>a.w),mn=Math.min(...v)-1,mx=Math.max(...v)+1;
  const P=i=>[30+i*(w-60)/(ws.length-1),h-30-(ws[i].w-mn)/(mx-mn)*(h-60)];
  x.strokeStyle='#ff2e7e';x.lineWidth=4;x.beginPath();ws.forEach((_,i)=>{const[a,b]=P(i);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();
  x.fillStyle='#ff2e7e';ws.forEach((_,i)=>{const[a,b]=P(i);x.beginPath();x.arc(a,b,6,0,7);x.fill()});
}
function activityTable(logs,limit){
  const l=[...(logs||[])].reverse().slice(0,limit||50);
  if(!l.length)return '<p class="small">No activities yet.</p>';
  return `<div class="scroll"><table><tr><th>Date</th><th>Activity</th><th>Details</th></tr>${l.map(a=>`<tr><td>${fmt(a.t)}</td><td>${esc(a.name)}</td><td>${esc(a.d2||'')}</td></tr>`).join('')}</table></div>`;
}
function assignedList(list,userId,canRevoke){
  if(!list.length)return '<p class="small">No suggested activities yet.</p>';
  return list.map(s=>{const e=exById(s.exId);return `<div class="sugg">${e?e.e:'•'} <b>${esc(e?e.n:s.exId)}</b> ${e?`<span class="small">(${e.d})</span>`:''}
   <div class="small">by ${esc(s.byName)} (${esc(s.byRole)}) • ${fmt(s.t)}</div>${s.note?`<div>${esc(s.note)}</div>`:''}
   ${canRevoke&&canRevoke(s)?`<button class="sm warn" onclick="revokeAssign('${userId}','${s.id}')">Revoke</button>`:''}</div>`}).join('');
}
const assignForm=id=>`<h4 style="margin-top:12px">Suggest / grant an activity</h4>
   <select id="as_ex">${EX.map(e=>`<option value="${e.id}">${e.e} ${e.n} (${e.d})</option>`).join('')}</select>
   <input id="as_note" placeholder="Note / instruction (optional)">
   <button class="ok" onclick="grantAssign('${id}')">Grant activity</button>`;
async function grantAssign(userId){
  const c=S.me;if(!c||!['admin','trainer'].includes(c.role))return;
  try{await addDoc(collection(db,'users',userId,'assigned'),{exId:document.getElementById('as_ex').value,note:document.getElementById('as_note').value.trim(),byUid:c.id,byName:c.name,byRole:c.role,t:Date.now()})}
  catch(e){alert(authErr(e))}
}
async function revokeAssign(userId,aid){try{await deleteDoc(doc(db,'users',userId,'assigned',aid))}catch(e){alert(authErr(e))}}

/* ================= USER DASHBOARD ================= */
function renderUser(u){
  if(!waterT)startWater();
  const b=bmi(u),g=u.goal||'all',doneToday=new Set(S.logs.filter(l=>l.d===today()).map(l=>l.exId));
  const list=EX.filter(e=>e.g.includes(g));
  const pct=Math.round(list.filter(e=>doneToday.has(e.id)).length/list.length*100);
  const ws=S.weights,diff=ws.length>1?(ws[ws.length-1].w-ws[0].w).toFixed(1):0;
  const keep=document.getElementById('tm')?.textContent||'00:00';
  root.innerHTML=`
  <div class="card" style="text-align:center">
    <div class="ring" data-t="${pct}%" style="background:conic-gradient(var(--pink) ${pct}%,#333 0)"></div>
    <p class="small">Today's progress • BMI ${b?b.toFixed(1)+' ('+bmiLabel(b)+')':'—'}</p>
    <p>🔥 Streak: <b>${streak(S.logs)}</b> days</p>
    <div class="feedback">${pct===100?'🎉 All done today! Great job!':pct>0?'Keep going, you are doing great!':"Let's start your workout today 💪"}</div>
    <div class="feedback" style="border-color:var(--ok);background:rgba(0,200,150,.1)">${MEALS[g]}</div>
  </div>
  ${S.assigned.length?`<div class="card"><h3>👨‍🏫 Suggested by your trainer/admin</h3>${assignedList(S.assigned,u.id,null)}</div>`:''}
  <div class="card">
    <h3>🎯 My Goal</h3>
    <select onchange="setGoal(this.value)">${Object.entries(GOALS).map(([k,v])=>`<option value="${k}" ${k===g?'selected':''}>${v}</option>`).join('')}</select>
    <h3 style="margin-top:14px">🏃 Activities</h3>
    ${list.map(e=>`<div class="ex ${doneToday.has(e.id)?'done':''}"><div><span class="e">${e.e}</span><b>${e.n}</b>
      <span class="badge ${e.p==='home'?'user':''}">${e.p}</span><div class="small">${e.d}</div></div>
      <button class="sm ${doneToday.has(e.id)?'sec':''}" onclick="logEx('${e.id}')">${doneToday.has(e.id)?'✓ Done':'Mark done'}</button></div>`).join('')}
  </div>
  <div class="card"><h3>⏱ Rest Timer</h3><div class="timer" id="tm">${keep}</div>
    <div class="row"><button onclick="startTimer()">Start</button><button class="sec" onclick="stopTimer()">Stop / Reset</button></div></div>
  <div class="card"><h3>⚖️ Weight Progress</h3>
    <p class="small">${ws.length>1?`Change since start: ${diff>0?'+':''}${diff} kg`:'Log your weight regularly'}</p>
    <canvas id="wc" height="160"></canvas>
    <div class="row" style="margin-top:8px"><input id="nw" type="number" step="0.1" placeholder="Log new weight (kg)"><button onclick="logWeight()" style="flex:0 0 100px">Log</button></div>
    <button class="sec" onclick="shareProgress()">📤 Share Progress</button></div>
  <div class="card"><h3>📊 Weekly Report</h3><p class="small">${weekly(S.logs)}</p></div>
  <div class="card"><h3>📸 Before / After</h3>
    <input type="file" accept="image/*" onchange="loadPhoto(this,'before')">
    ${S.photos.before?`<img class="ph" src="${S.photos.before}">`:''}
    <input type="file" accept="image/*" onchange="loadPhoto(this,'after')">
    ${S.photos.after?`<img class="ph" src="${S.photos.after}">`:''}</div>
  <div class="card"><h3>📝 My Activity History</h3>${activityTable(S.logs,15)}</div>`;
  drawChart('wc',ws);
}
function weekly(logs){const since=Date.now()-7*864e5,l=logs.filter(x=>x.t>=since);return `${l.length} activities done on ${new Set(l.map(x=>x.d)).size} of the last 7 days.`}
async function setGoal(g){try{await updateDoc(doc(db,'users',S.me.id),{goal:g})}catch(e){alert(authErr(e))}}
async function logEx(id){
  const c=S.me;if(!c||c.role!=='user')return;const e=exById(id);
  if(S.logs.some(l=>l.d===today()&&l.exId===id))return;
  try{await setDoc(doc(db,'users',c.id,'logs',today()+'_'+id),{uid:c.id,exId:id,name:e.n,d2:e.d,d:today(),t:Date.now()})}catch(err){alert(authErr(err))}
}
async function logWeight(){
  const w=parseFloat(document.getElementById('nw').value);if(!w||w<20||w>400)return alert('Enter a valid weight.');
  const c=S.me;
  try{
    await addDoc(collection(db,'users',c.id,'weights'),{d:today(),w,t:Date.now()});
    await updateDoc(doc(db,'users',c.id),{weight:w});
    await addDoc(collection(db,'users',c.id,'logs'),{uid:c.id,exId:'weight',name:'Weight logged',d2:w+' kg',d:today(),t:Date.now()});
  }catch(e){alert(authErr(e))}
}
function shareProgress(){
  const t=`I'm on a ${streak(S.logs)}-day streak on FITROVA 🔥 Current weight: ${S.me.weight}kg`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});else{navigator.clipboard?.writeText(t);alert('Copied to clipboard!')}
}
function loadPhoto(inp,key){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=async()=>{
    const c=document.createElement('canvas'),s=Math.min(1,400/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const data=c.toDataURL('image/jpeg',.6);
    if(data.length>390000)return alert('Photo is too large.');
    try{await setDoc(doc(db,'users',S.me.id,'photos',key),{data,t:Date.now()})}catch(e){alert(authErr(e))}
  };im.src=r.result};r.readAsDataURL(f);
}
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{tsec++;const t=document.getElementById('tm');if(t)t.textContent=String(Math.floor(tsec/60)).padStart(2,'0')+':'+String(tsec%60).padStart(2,'0')},1000)}
function stopTimer(){clearInterval(timerInt);tsec=0;const t=document.getElementById('tm');if(t)t.textContent='00:00'}

/* ================= ADMIN DASHBOARD ================= */
function renderAdmin(a){
  const us=S.users,reports=S.reports,unread=reports.filter(r=>!r.read).length;
  const tabs=[['overview','Overview'],['users','Accounts'],['activity','Activity'],['reports','Trainer Reports'+(unread?` (${unread})`:'')]];
  let body='';
  if(S.detail)body=userDetail('admin');
  else if(ui.tab==='overview'){
    body=`<div class="card"><div class="stats">
      <div class="stat"><b>${us.length}</b>Total accounts</div>
      <div class="stat"><b>${us.filter(u=>u.role==='user').length}</b>Users</div>
      <div class="stat"><b>${us.filter(u=>u.role==='trainer').length}</b>Trainers</div>
      <div class="stat"><b>${us.filter(u=>u.status==='pending').length}</b>Pending approval</div>
      <div class="stat"><b>${us.filter(u=>u.status==='revoked').length}</b>Revoked</div>
      <div class="stat"><b>${unread}</b>Unread reports</div></div></div>
      <div class="card"><h3>Recent logins</h3>${recentLogins(us)}</div>`;
  }else if(ui.tab==='users'){
    body=`<div class="card"><h3>All registered accounts</h3><div class="scroll"><table>
     <tr><th>Name / Email</th><th>Role</th><th>Status</th><th>Last login</th><th>Logins</th><th>Actions</th></tr>
     ${us.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="small">${esc(u.email)}</div></td>
      <td><span class="badge ${u.role}">${u.role}</span></td><td><span class="badge ${u.status}">${u.status}</span></td>
      <td>${fmt(u.lastLogin)}</td><td>${u.loginCount||0}</td>
      <td>${u.role==='user'?`<button class="sm sec" onclick="openDetail('${u.id}')">View</button>`:''}
       ${u.id!==a.id?(u.status==='active'?`<button class="sm warn" onclick="setStatus('${u.id}','revoked')">Revoke</button>`:`<button class="sm ok" onclick="setStatus('${u.id}','active')">Grant</button>`):''}
       ${u.id!==a.id?`<button class="sm sec" onclick="editUser('${u.id}')">Edit</button><button class="sm" onclick="delUser('${u.id}')">Delete</button>`:''}</td></tr>`).join('')}
     </table></div></div>`;
  }else if(ui.tab==='activity'){
    const nm=id=>us.find(u=>u.id===id)?.name||'(deleted)';
    body=`<div class="card"><h3>All user activities</h3>${S.allLogs.length?`<div class="scroll"><table><tr><th>When</th><th>User</th><th>Activity</th><th>Details</th></tr>
     ${S.allLogs.slice(0,100).map(l=>`<tr><td>${fmt(l.t)}</td><td>${esc(nm(l.uid))}</td><td>${esc(l.name)}</td><td>${esc(l.d2||'')}</td></tr>`).join('')}</table></div>`:'<p class="small">No activity yet.</p>'}</div>`;
  }else{
    body=`<div class="card"><h3>Reports from trainers</h3>${reports.length?[...reports].reverse().map(r=>`
      <div class="${r.read?'feedback':'sugg'}"><b>${esc(r.fromName)}</b> about <b>${esc(r.userName||'general')}</b>
      <div class="small">${fmt(r.t)}</div><div>${esc(r.msg)}</div>
      ${r.read?'':`<button class="sm ok" onclick="readReport('${r.id}')">Mark as read</button>`}</div>`).join(''):'<p class="small">No reports.</p>'}</div>`;
  }
  root.innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button class="${ui.tab===k&&!S.detail?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>${body}`;
  if(S.detail)drawChart('dc',S.d.weights);
}
function recentLogins(us){
  const r=us.filter(u=>u.lastLogin).sort((a,b)=>b.lastLogin-a.lastLogin).slice(0,8);
  return r.length?`<div class="scroll"><table><tr><th>Name</th><th>Role</th><th>Last login</th></tr>${r.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td><td>${fmt(u.lastLogin)}</td></tr>`).join('')}</table></div>`:'<p class="small">No logins yet.</p>';
}
async function setStatus(id,s){
  if(S.me.role!=='admin'||id===S.me.id)return;
  try{await updateDoc(doc(db,'users',id),{status:s})}catch(e){alert(authErr(e))}
}
async function delUser(id){
  if(S.me.role!=='admin'||id===S.me.id)return;
  if(!confirm('Delete this account data permanently?'))return;
  try{
    for(const sc of ['logs','weights','assigned','photos']){
      const s=await getDocs(collection(db,'users',id,sc));
      for(const d of s.docs)await deleteDoc(d.ref);
    }
    await deleteDoc(doc(db,'users',id));
    if(S.detail===id)closeDetail();
  }catch(e){alert(authErr(e))}
}
async function editUser(id){
  if(S.me.role!=='admin')return;const u=S.users.find(x=>x.id===id);if(!u)return;
  const name=prompt('Name:',u.name);if(name===null)return;
  const upd={name:name.trim()||u.name};
  if(u.role==='user'){
    const age=prompt('Age:',u.age),height=age===null?null:prompt('Height cm:',u.height),weight=height===null?null:prompt('Weight kg:',u.weight);
    if(weight===null)return;
    upd.age=+age||u.age;upd.height=+height||u.height;upd.weight=+weight||u.weight;
  }
  try{await updateDoc(doc(db,'users',id),upd)}catch(e){alert(authErr(e))}
}
async function readReport(id){if(S.me.role!=='admin')return;try{await updateDoc(doc(db,'reports',id),{read:true})}catch(e){alert(authErr(e))}}

/* ================= TRAINER DASHBOARD (read-only + suggest + report) ================= */
function renderTrainer(t){
  const us=S.users.filter(u=>u.role==='user');
  let body='';
  if(S.detail)body=userDetail('trainer');
  else body=`<div class="ro">🔒 Trainer access: you can view users, suggest activities and report to admin. You cannot edit or delete user info or activities.</div>
   <div class="card"><h3>Users (${us.length})</h3>${us.length?`<div class="scroll"><table><tr><th>Name</th><th>Goal</th><th>BMI</th><th>Status</th><th></th></tr>
   ${us.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(GOALS[u.goal]||'')}</td><td>${bmi(u)?bmi(u).toFixed(1):'—'}</td><td><span class="badge ${u.status}">${u.status}</span></td>
   <td><button class="sm" onclick="openDetail('${u.id}')">Open</button></td></tr>`).join('')}</table></div>`:'<p class="small">No users registered yet.</p>'}</div>
   <div class="card"><h3>📨 General report to admin</h3><textarea id="gen_rep" rows="3" placeholder="Update for admin..."></textarea>
   <button onclick="sendReport(null)">Send to admin</button></div>`;
  root.innerHTML=body;
  if(S.detail)drawChart('dc',S.d.weights);
}
async function sendReport(userId){
  const c=S.me;if(c.role!=='trainer')return;
  const el=document.getElementById(userId?'rep_msg':'gen_rep'),m=el.value.trim();if(!m)return alert('Write a message first.');
  const u=userId?S.users.find(x=>x.id===userId):null;
  try{await addDoc(collection(db,'reports'),{fromUid:c.id,fromName:c.name,userId:userId||null,userName:u?.name||'',msg:m,t:Date.now(),read:false});el.value='';alert('Sent to admin ✓')}
  catch(e){alert(authErr(e))}
}

/* ================= SHARED USER DETAIL (admin + trainer) ================= */
function userDetail(viewer){
  const u=S.users.find(x=>x.id===S.detail);if(!u){return '<p class="small">Loading…</p>'}
  const isAdmin=viewer==='admin',c=S.me,d=S.d;
  return `<button class="sec" style="width:auto;padding:8px 14px" onclick="closeDetail()">← Back</button>
  <div class="card"><h3>${esc(u.name)} <span class="badge ${u.status}">${u.status}</span></h3>
   <p class="small">${esc(u.email)} • Registered ${fmt(u.created)} • Last login ${fmt(u.lastLogin)} • ${u.loginCount||0} logins</p>
   <div class="stats" style="margin-top:8px">
    <div class="stat"><b>${esc(u.age)||'—'}</b>Age</div><div class="stat"><b>${esc(u.height)||'—'}</b>Height cm</div>
    <div class="stat"><b>${esc(u.weight)||'—'}</b>Weight kg</div><div class="stat"><b>${bmi(u)?bmi(u).toFixed(1):'—'}</b>BMI</div>
    <div class="stat"><b>${streak(d.logs)}</b>Streak</div><div class="stat"><b>${d.logs.length}</b>Activities</div></div>
   <p class="small" style="margin-top:8px">Goal: ${esc(GOALS[u.goal]||'')}</p>
   ${isAdmin?`<div class="row"><button class="sm sec" onclick="editUser('${u.id}')">Edit info</button>
     ${u.status==='active'?`<button class="sm warn" onclick="setStatus('${u.id}','revoked')">Revoke access</button>`:`<button class="sm ok" onclick="setStatus('${u.id}','active')">Grant access</button>`}
     <button class="sm" onclick="delUser('${u.id}')">Delete</button></div>`:'<div class="ro">🔒 Read-only view</div>'}
  </div>
  <div class="card"><h3>⚖️ Weight history</h3><canvas id="dc" height="160"></canvas></div>
  ${d.photos.before||d.photos.after?`<div class="card"><h3>📸 Before / After</h3>${d.photos.before?`<img class="ph" src="${d.photos.before}">`:''}${d.photos.after?`<img class="ph" src="${d.photos.after}">`:''}</div>`:''}
  <div class="card"><h3>📝 Activities done</h3>${activityTable(d.logs,60)}</div>
  <div class="card"><h3>👨‍🏫 Suggested activities</h3>
   ${assignedList(d.assigned,u.id,s=>isAdmin||s.byUid===c.id)}${assignForm(u.id)}</div>
  ${!isAdmin?`<div class="card"><h3>📨 Report to admin about ${esc(u.name)}</h3><textarea id="rep_msg" rows="3" placeholder="Update for admin..."></textarea><button onclick="sendReport('${u.id}')">Send to admin</button></div>`:''}`;
}

/* ===== expose functions used by inline onclick handlers (module scope) ===== */
Object.assign(window,{toggleMode,authTabSet,doRegister,doLogin,logout,setGoal,logEx,logWeight,shareProgress,loadPhoto,startTimer,stopTimer,
  roleFor,grantAssign,revokeAssign,openDetail,closeDetail,setTab,setStatus,delUser,editUser,readReport,sendReport});
</script>
</body>
</html>
